<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b52">
<title>테니스 복식 대진</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#17201d;--muted:#66726e;--line:#d9e1de;--accent:#0f6b52;--accent2:#e8f3ef;--danger:#a33;--shadow:0 8px 24px rgba(0,0,0,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.app{max-width:1100px;margin:auto;padding:12px 12px 84px}.top{position:sticky;top:0;z-index:20;background:rgba(244,247,246,.94);backdrop-filter:blur(8px);padding:10px 0 8px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{font-size:21px;margin:0}.badge{font-size:12px;background:var(--accent2);color:var(--accent);padding:5px 8px;border-radius:999px;font-weight:700}.tabs{display:flex;gap:6px;overflow:auto;padding-top:10px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:700;color:#46514d}.tab.active{background:var(--accent);color:white;border-color:var(--accent)}.page{display:none}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}.card h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:700}input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:800;background:var(--accent);color:#fff}.btn.secondary{background:#eef2f0;color:#24302c}.btn.danger{background:#f7eaea;color:var(--danger)}.btn.small{padding:7px 9px;font-size:13px}.btn:disabled{opacity:.45}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row .grow{flex:1}.player{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #edf1ef}.player:first-child{border-top:0}.player-main{min-width:0}.player-name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:3px}.pill{display:inline-block;font-size:11px;padding:3px 6px;border-radius:999px;background:#eef2f0;margin-right:4px}.court-rule{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}.court-rule strong{display:block;margin-bottom:8px}.checks{display:flex;gap:12px;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:5px;font-size:14px}.checks input{width:auto}.summary{font-weight:800;color:var(--accent)}.court{margin:12px 0}.court h3{margin:0 0 8px;font-size:16px}.match{border:1px solid var(--line);border-radius:13px;padding:11px;margin:8px 0;background:#fff}.match-head{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}.team{text-align:center;font-weight:800}.vs{font-size:12px;color:var(--muted)}.score-row{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:9px}.score{width:66px;text-align:center}.status{font-size:12px;font-weight:700;color:var(--accent);text-align:center;margin-top:7px}.rank{display:grid;grid-template-columns:32px 1fr repeat(5,46px);gap:5px;padding:9px 0;border-top:1px solid #edf1ef;align-items:center;font-size:13px}.rank.head{font-size:11px;color:var(--muted);font-weight:700;border-top:0}.rank .name{font-weight:800}.empty{text-align:center;color:var(--muted);padding:24px 8px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:flex-end;z-index:100}.modal.show{display:flex}.sheet{background:white;width:100%;max-height:86vh;border-radius:20px 20px 0 0;padding:14px;overflow:auto}.sheet h2{margin:4px 0 12px}.select-player{display:flex;align-items:center;gap:10px;border-top:1px solid #edf1ef;padding:11px 2px}.select-player input{width:20px;height:20px}.notice{font-size:12px;color:var(--muted);line-height:1.5}.footer-actions{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:30}.footer-actions .inner{max-width:1100px;margin:auto;display:flex;gap:8px}.footer-actions .btn{flex:1}.hidden{display:none!important}
@media(max-width:700px){.grid3{grid-template-columns:1fr 1fr 1fr}.rank{grid-template-columns:28px 1fr repeat(5,36px);font-size:11px}.card{padding:12px}.app{padding-left:9px;padding-right:9px}.team{font-size:13px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand"><h1>🎾 테니스 복식 대진</h1><span class="badge">모바일 PWA</span></div>
    <div class="tabs">
      <button class="tab active" data-page="players">참가자</button>
      <button class="tab" data-page="settings">경기 설정</button>
      <button class="tab" data-page="schedule">대진표</button>
      <button class="tab" data-page="ranking">순위</button>
    </div>
  </div>

  <section id="players" class="page active">
    <div class="card"><h2>참가자 등록</h2>
      <div class="grid3">
        <div class="field"><label>이름</label><input id="name" maxlength="20" placeholder="홍길동"></div>
        <div class="field"><label>성별</label><select id="gender"><option>남</option><option>여</option></select></div>
        <div class="field"><label>실력</label><select id="level"><option value="1">1 입문</option><option value="2">2 초급</option><option value="3" selected>3 중급</option><option value="4">4 상급</option><option value="5">5 최상급</option></select></div>
      </div>
      <div class="row" style="margin-top:10px"><button class="btn" id="addPlayer">추가</button><button class="btn secondary" id="openRoster">저장 참가자 선택</button><button class="btn secondary" id="exportRoster">명단 내보내기</button><button class="btn secondary" id="importRosterBtn" type="button">파일 앱에서 명단 가져오기</button><input id="importRoster" type="file" accept=".json,application/json,text/plain" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
      <p class="notice">참가자는 브라우저에 자동 저장됩니다. 같은 휴대폰·같은 브라우저에서는 다음에 다시 사용할 수 있습니다.</p>
    </div>
    <div class="card"><div class="row"><h2 class="grow" style="margin:0">오늘 참가자</h2><strong id="playerCount">0명</strong></div><div id="playerList"></div></div>
  </section>

  <section id="settings" class="page">
    <div class="card"><h2>경기 수</h2>
      <div class="grid3"><div class="field"><label>남복</label><input id="mensGames" type="number" min="0" max="8" value="2"></div><div class="field"><label>혼복</label><input id="mixedGames" type="number" min="0" max="8" value="2"></div><div class="field"><label>여복</label><input id="womensGames" type="number" min="0" max="8" value="2"></div></div>
      <div class="row" style="margin-top:10px"><span class="summary" id="totalGames">총 6경기</span><span class="notice">권장 합계 4~8경기</span></div>
    </div>
    <div class="card"><h2>운영 방식</h2><div class="grid"><div class="field"><label>파트너 방식</label><select id="partnerMode"><option>파트너 변경</option><option>고정 파트너</option></select></div><div class="field"><label>코트 수</label><select id="courtCount"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div></div></div>
    <div class="card"><h2>코트별 허용 경기 종류</h2><div id="courtRules"></div><p class="notice">예: 1코트에서 남복+혼복만 허용하고, 2코트는 여복만 허용할 수 있습니다.</p></div>
    <div class="card" id="fixedCard"><h2>고정 파트너</h2><div id="fixedPartners"></div><p class="notice">고정 파트너 방식일 때만 적용됩니다. 남복/여복/혼복 조건과 맞지 않는 팀은 해당 경기 종류에 사용할 수 없습니다.</p></div>
  </section>

  <section id="schedule" class="page"><div id="scheduleArea" class="card"><div class="empty">아직 생성된 대진이 없습니다.</div></div></section>
  <section id="ranking" class="page"><div class="card"><h2>개인 순위</h2><div id="rankingArea"></div></div></section>
</div>

<div class="footer-actions"><div class="inner"><button class="btn" id="generate">전체 대진 생성</button><button class="btn secondary" id="resetMatches">대진 초기화</button></div></div>

<div class="modal" id="rosterModal"><div class="sheet"><div class="row"><h2 class="grow">저장 참가자 선택</h2><button class="btn secondary small" id="closeRoster">닫기</button></div><div class="row"><button class="btn secondary small" id="selectAll">전체 선택</button><button class="btn secondary small" id="selectNone">전체 해제</button><span id="selectedCount" class="summary"></span></div><div id="rosterList"></div><button class="btn" id="loadSelected" style="width:100%;margin-top:10px">선택 참가자 불러오기</button></div></div>
<script src="app.js"></script>
</body></html>
